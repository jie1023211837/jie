<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>看拼音写词语默写</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif;}
body{
  background:#f8fbf8;
  padding:12px;
  font-size:16px;
}
.title{text-align:center;font-size:22px;font-weight:bold;margin-bottom:12px;color:#222;}
.info-line{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  justify-content:center;
  margin-bottom:12px;
  padding:8px;
  background:#eef8ee;
  border-radius:8px;
}
.jump-area{
  display:flex;
  gap:6px;
  align-items:center;
}
.jump-area input{
  width:70px;
  padding:4px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:4px;
}
.btn{
  padding:7px 10px;
  border:none;
  border-radius:6px;
  background:#369;
  color:#fff;
  font-size:15px;
}
.btn-group{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin:12px 0;
}
.btn-warn{background:#d63031;}
.btn-ok{background:#00b894;}
.btn-gray{background:#636e72;}
.card{
  background:#fff;
  border-radius:10px;
  padding:20px;
  margin:12px 0;
  box-shadow:0 1px 4px #00000015;
}
.py-text{font-size:32px;text-align:center;margin-bottom:10px;color:#222;font-weight:bold;}
.explain-text{font-size:18px;text-align:center;color:#555;margin-bottom:16px;}
.answer-text{
  font-size:34px;
  text-align:center;
  color:#0984e3;
  font-weight:bold;
  display:none;
}
#drawCanvas{
  width:100%;
  height:280px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fff;
  touch-action:none;
}
.wrong-modal{
  position:fixed;
  left:0;top:0;right:0;bottom:0;
  background:rgba(0,0,0,0.55);
  display:none;
  padding:16px;
  overflow:auto;
}
.modal-inner{
  background:#fff;
  border-radius:10px;
  padding:16px;
  max-width:700px;
  margin:0 auto;
}
.wrong-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #eee;
}
</style>
</head>
<body>
<div class="title">看拼音写词语默写</div>
<div class="info-line">
  <span id="progressText">总题：0 | 当前：0/0</span>
  <div class="jump-area">
    <span>从第</span>
    <input id="jumpInput" type="number" min="1" value="1">
    <span>题开始</span>
    <button class="btn" id="jumpBtn">跳转</button>
  </div>
</div>

<div class="btn-group">
  <button class="btn" id="prevBtn">上一题</button>
  <button class="btn" id="nextBtn">下一题</button>
  <button class="btn btn-ok" id="showAnswerBtn">查看答案</button>
  <button class="btn" id="addWrongBtn">加入错题本</button>
  <button class="btn" id="goBankBtn">题库</button>
  <button class="btn" id="openWrongBtn">错题本</button>
  <button class="btn btn-gray" id="resetBtn">重新开始</button>
  <button class="btn btn-warn" id="clearCanvasBtn">清空画板</button>
  <button class="btn" id="backBtn">返回</button>
</div>

<div class="card">
  <div class="py-text" id="pyDom"></div>
  <div class="explain-text" id="explainDom"></div>
  <div class="answer-text" id="answerDom"></div>
  <canvas id="drawCanvas"></canvas>
</div>

<!-- 错题弹窗 -->
<div class="wrong-modal" id="wrongModal">
  <div class="modal-inner">
    <div class="btn-group">
      <button class="btn" id="selectAllWrong">全选</button>
      <button class="btn btn-warn" id="delSelected">删除选中</button>
      <button class="btn btn-ok" id="startWrongPractice">开始练习错题</button>
      <button class="btn btn-gray" id="closeWrongModal">关闭</button>
    </div>
    <div id="wrongListBox"></div>
  </div>
</div>

<script src="wordlib.js?v=2"></script>
<script>
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');

let wItemList = [];
let wrongList = [];
let currentIdx = 0;
let normalIndex = Number(localStorage.getItem("mori_bank_idx")) || 0;
let wrongIndex = Number(localStorage.getItem("mori_wrong_idx")) || 0;
let mode = localStorage.getItem("mori_mode") || "normal";
let isDrawing = false;
let lastX=0,lastY=0;

const pyDom = document.getElementById("pyDom");
const explainDom = document.getElementById("explainDom");
const answerDom = document.getElementById("answerDom");
const progressText = document.getElementById("progressText");
const jumpInput = document.getElementById("jumpInput");

function resizeCanvas(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

// 画板事件
canvas.addEventListener("touchstart",(e)=>{
  e.preventDefault();
  isDrawing=true;
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  lastX = t.clientX - rect.left;
  lastY = t.clientY - rect.top;
})
canvas.addEventListener("touchmove",(e)=>{
  if(!isDrawing)return;
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const x = t.clientX - rect.left;
  const y = t.clientY - rect.top;
  ctx.beginPath();
  ctx.moveTo(lastX,lastY);
  ctx.lineTo(x,y);
  ctx.lineWidth=3;
  ctx.strokeStyle="#222";
  ctx.lineCap="round";
  ctx.stroke();
  lastX=x;lastY=y;
})
canvas.addEventListener("touchend",()=>isDrawing=false);
canvas.addEventListener("mousedown",(e)=>{
  isDrawing=true;
  const rect = canvas.getBoundingClientRect();
  lastX = e.clientX - rect.left;
  lastY = e.clientY - rect.top;
})
canvas.addEventListener("mousemove",(e)=>{
  if(!isDrawing)return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  ctx.beginPath();
  ctx.moveTo(lastX,lastY);
  ctx.lineTo(x,y);
  ctx.lineWidth=3;
  ctx.strokeStyle="#222";
  ctx.lineCap="round";
  ctx.stroke();
  lastX=x;lastY=y;
})
canvas.addEventListener("mouseup",()=>isDrawing=false);
document.getElementById("clearCanvasBtn").onclick = ()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

// 加载词库
function loadLib(){
  if(typeof wordList === "undefined" || !Array.isArray(wordList)){
    alert("wordlib.js加载失败，请检查文件！");
    return;
  }
  wItemList = [...wordList];
  let savedWrong = localStorage.getItem("mori_wronglist");
  if(savedWrong) wrongList = JSON.parse(savedWrong);
  if(mode === "normal"){
    currentIdx = normalIndex;
  }else{
    currentIdx = wrongIndex;
  }
  render();
}

function saveProgress(){
  if(mode === "normal"){
    normalIndex = currentIdx;
    localStorage.setItem("mori_bank_idx", normalIndex);
  }else{
    wrongIndex = currentIdx;
    localStorage.setItem("mori_wrong_idx", wrongIndex);
  }
  localStorage.setItem("mori_mode", mode);
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  answerDom.style.display="none";
  let arr;
  if(mode === "normal") arr = wItemList;
  else arr = wrongList;
  if(arr.length ===0){
    pyDom.innerText="暂无题目";
    explainDom.innerText="";
    answerDom.innerText="";
    progressText.innerText="总题：0 | 当前：0/0";
    return;
  }
  if(currentIdx >= arr.length) currentIdx = arr.length -1;
  if(currentIdx <0) currentIdx=0;
  const item = arr[currentIdx];
  pyDom.innerText = item.py;
  explainDom.innerText = item.explain;
  answerDom.innerText = item.word;
  progressText.innerText = `总题：${arr.length} | 当前：第 ${currentIdx+1} / ${arr.length} 题`;
  jumpInput.value = currentIdx + 1;
  saveProgress();
}

// 切换模式
function switchNormal(){
  if(mode === "wrong"){
    wrongIndex = currentIdx;
    localStorage.setItem("mori_wrong_idx", wrongIndex);
  }
  mode = "normal";
  currentIdx = normalIndex;
  render();
}
function switchWrongPractice(){
  if(mode === "normal"){
    normalIndex = currentIdx;
    localStorage.setItem("mori_bank_idx", normalIndex);
  }
  mode = "wrong";
  currentIdx = wrongIndex;
  document.getElementById("wrongModal").style.display="none";
  render();
}

// 上一题 下一题
document.getElementById("prevBtn").onclick = ()=>{
  currentIdx--;
  render();
}
document.getElementById("nextBtn").onclick = ()=>{
  currentIdx++;
  render();
}
document.getElementById("showAnswerBtn").onclick = ()=>{
  answerDom.style.display = answerDom.style.display === "none" ? "block":"none";
}

// 加入错题本
document.getElementById("addWrongBtn").onclick = ()=>{
  if(mode !== "normal"){
    alert("只能在题库模式添加错题！");
    return;
  }
  const item = wItemList[currentIdx];
  const has = wrongList.some(x=>x.py===item.py && x.word===item.word);
  if(has){
    alert("该词语已经在错题本中！");
    return;
  }
  wrongList.push(item);
  localStorage.setItem("mori_wronglist", JSON.stringify(wrongList));
  alert("已加入错题本");
}

document.getElementById("goBankBtn").onclick = switchNormal;
document.getElementById("backBtn").onclick = switchNormal;

// 错题弹窗
const wrongModal = document.getElementById("wrongModal");
document.getElementById("openWrongBtn").onclick = ()=>{
  renderWrongListBox();
  wrongModal.style.display="block";
}
document.getElementById("closeWrongModal").onclick = ()=>{
  wrongModal.style.display="none";
}
document.getElementById("startWrongPractice").onclick = switchWrongPractice;

function renderWrongListBox(){
  const box = document.getElementById("wrongListBox");
  box.innerHTML = "";
  wrongList.forEach((it,idx)=>{
    const div = document.createElement("div");
    div.className="wrong-item";
    div.innerHTML = `
      <input type="checkbox" class="wrong-check" data-idx="${idx}">
      <span>${it.py} — ${it.word}（${it.explain}）</span>
      <button class="btn btn-warn del-one" data-idx="${idx}">删除</button>
    `
    box.appendChild(div);
  })
  // 单个删除
  document.querySelectorAll(".del-one").forEach(btn=>{
    btn.onclick = function(){
      const i = Number(this.dataset.idx);
      wrongList.splice(i,1);
      localStorage.setItem("mori_wronglist", JSON.stringify(wrongList));
      renderWrongListBox();
    }
  })
}
//全选
document.getElementById("selectAllWrong").onclick = ()=>{
  const checks = document.querySelectorAll(".wrong-check");
  const all = [...checks].every(c=>c.checked);
  checks.forEach(c=>c.checked = !all);
}
//删除选中
document.getElementById("delSelected").onclick = ()=>{
  const checks = [...document.querySelectorAll(".wrong-check")].filter(c=>c.checked);
  const delIdx = checks.map(c=>Number(c.dataset.idx)).sort((a,b)=>b-a);
  delIdx.forEach(i=>wrongList.splice(i,1));
  localStorage.setItem("mori_wronglist", JSON.stringify(wrongList));
  renderWrongListBox();
}

//重新开始（当前模式归零）
document.getElementById("resetBtn").onclick = ()=>{
  if(confirm("确定当前模式从头开始？")){
    currentIdx = 0;
    if(mode==="normal") normalIndex=0;
    else wrongIndex=0;
    render();
  }
}

//跳转题号
document.getElementById("jumpBtn").onclick = ()=>{
  const val = Number(jumpInput.value);
  let arr = mode==="normal"?wItemList:wrongList;
  if(isNaN(val) || val<1 || val>arr.length){
    alert(`范围：1 ~ ${arr.length}`);
    return;
  }
  currentIdx = val - 1;
  render();
}

loadLib();
</script>
</body>
</html>
