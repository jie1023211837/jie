<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>看拼音写词语（成人版）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{
  background: #f0f7ff;
  background-image: radial-gradient(#dcebfa 1px, transparent 1px);
  background-size: 20px 20px;
  padding:16px;color:#222
}
.box{max-width:800px;margin:0 auto}
.top-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
  font-size:18px;
  color:#333;
  font-weight:500;
}
.btn-row-1{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}
.btn{
  padding:10px 16px;
  border:none;border-radius:99px;
  font-size:16px;cursor:pointer;
}
.btn-blue{background:#4080ff;color:#fff;}
.btn-gray{background:#c9d8ee;color:#666;cursor:not-allowed;}
.btn-light{background:#e6f0ff;color:#3366bb;}
.card{
  background:#fff;border-radius:20px;padding:24px;
  box-shadow:0 2px 12px #00000010;
  text-align:center;
}
.pinyin{font-size:64px;font-weight:bold;margin:12px 0 12px;}
.explain{font-size:24px;color:#444;margin-bottom:24px;}
canvas{
  border: 8px solid #c8d8e8;
  border-radius:16px;
  background:#fff;
  width:100%;touch-action:none;
}
.btn-row-2{
  display:flex;
  gap:16px;
  margin-top:24px;
  justify-content:center;
}
.btn-empty{
  background:#fff;
  border:1px solid #b8c8e0;
  color:#333;
  display:flex;
  align-items:center;
  gap:6px;
}
.btn-back{
  background:#4080ff;color:#fff;
  display:flex;
  align-items:center;
  gap:6px;
}
.answer-area{margin-top:16px;padding:12px;background:#f0f4fa;border-radius:10px;display:none}
.answer-word{font-size:26px;font-weight:bold;color:#222}
.modal{position:fixed;inset:0;background:#00000050;display:none;align-items:center;justify-content:center;padding:16px}
.modal-content{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:700px;max-height:85vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.close{font-size:24px;cursor:pointer}
.item{padding:8px;border-bottom:1px solid #eee}
.item span{font-size:14px;color:#666}
.check-row{margin:8px 0}
</style>
</head>
<body>
<div class="box">
  <div class="top-info">
    <div id="progressText">总题：0 ｜ 已完成：0</div>
  </div>
  <div class="btn-row-1">
    <button class="btn btn-light" onclick="prevItem()">上一题</button>
    <button class="btn btn-light" onclick="nextItem()">下一题</button>
    <button class="btn btn-light" onclick="showAnswer()">查看答案</button>
    <button class="btn btn-blue" id="wrongBtn" onclick="addWrong()">加入错题本</button>
    <button class="btn btn-light" onclick="openLib()">题库</button>
    <button class="btn btn-light" onclick="openWrongBook()">错题本</button>
    <button class="btn btn-light" onclick="resetAll()">重新开始</button>
  </div>

  <div class="card">
    <div class="pinyin" id="pinyinBox"></div>
    <div class="explain" id="explainBox"></div>
    <canvas id="drawCanvas"></canvas>
    <div class="btn-row-2">
      <button class="btn btn-empty" onclick="clearCanvas()">☑ 清空画板</button>
      <button class="btn btn-back" onclick="backToNormal()">⬅ 返回</button>
    </div>
    <div class="answer-area" id="answerBox">
      <div>正确词语：<span class="answer-word" id="ansWord"></span></div>
    </div>
  </div>
</div>

<!-- 题库弹窗 -->
<div class="modal" id="libModal">
  <div class="modal-content">
    <div class="modal-head"><h3>全部题库</h3><span class="close" onclick="closeLib()">×</span></div>
    <div id="libList"></div>
  </div>
</div>

<!-- 错题本弹窗 -->
<div class="modal" id="wrongModal">
  <div class="modal-content">
    <div class="modal-head">
      <h3>错题本</h3>
      <div>
        <button class="btn btn-light" onclick="selectAllWrong()">全选</button>
        <button class="btn btn-gray" onclick="delSelectedWrong()">删除选中</button>
        <span class="close" onclick="closeWrongBook()">×</span>
      </div>
    </div>
    <div id="wrongList"></div>
  </div>
</div>

<script src="wordlib.js"></script>
<script>
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let wItemList = [];
let wrongList = [];
let currentIdx = 0;
let mode = "normal"; // normal / wrong
let isDrawing = false;
let lastX=0,lastY=0;

// 画布适配
function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 320;
  ctx.lineWidth=4;
  ctx.lineCap="round";
  ctx.strokeStyle="#222";
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// 画笔
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  isDrawing=true;
  const t=e.touches[0];
  const r=canvas.getBoundingClientRect();
  lastX = t.clientX - r.left;
  lastY = t.clientY - r.top;
})
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!isDrawing)return;
  const t=e.touches[0];
  const r=canvas.getBoundingClientRect();
  const x = t.clientX - r.left;
  const y = t.clientY - r.top;
  ctx.beginPath();
  ctx.moveTo(lastX,lastY);
  ctx.lineTo(x,y);
  ctx.stroke();
  lastX=x;lastY=y;
})
canvas.addEventListener('touchend',()=>isDrawing=false);
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);}

// 本地存储key（和之前完全一样，不会清空你的进度）
const KEY_PROGRESS = "write_progress_idx";
const KEY_WRONG = "write_wrong_list";

// 加载本地数据
function loadLocal(){
  const p = localStorage.getItem(KEY_PROGRESS);
  if(p!==null) currentIdx = parseInt(p);
  const w = localStorage.getItem(KEY_WRONG);
  if(w) wrongList = JSON.parse(w);
}
function saveProgress(){
  localStorage.setItem(KEY_PROGRESS,currentIdx.toString());
}
function saveWrong(){
  localStorage.setItem(KEY_WRONG,JSON.stringify(wrongList));
}

// 更新进度文字
function updateProgressText(){
  let total = wItemList.length;
  let done = currentIdx;
  document.getElementById("progressText").innerText = `总题：${total} ｜ 已完成：${done}`;
}

// 更新错题按钮状态【核心】
function refreshWrongBtn(){
  const item = wItemList[currentIdx];
  const has = wrongList.some(x=>x.word===item.word && x.pinyin===item.pinyin);
  const btn = document.getElementById("wrongBtn");
  if(has){
    btn.innerText = "已在错题本";
    btn.className = "btn btn-gray";
    btn.onclick = null;
  }else{
    btn.innerText = "加入错题本";
    btn.className = "btn btn-blue";
    btn.onclick = addWrong;
  }
}

// 渲染题目
function render(){
  if(wItemList.length===0) return;
  const item = wItemList[currentIdx];
  document.getElementById('pinyinBox').innerText = item.pinyin;
  document.getElementById('explainBox').innerText = item.explain;
  document.getElementById('ansWord').innerText = item.word;
  document.getElementById('answerBox').style.display="none";
  clearCanvas();
  updateProgressText();
  refreshWrongBtn();
}

// 切换模式：正常题库 / 错题模式
function setNormalMode(){
  mode="normal";
  wItemList = wordLib;
  loadLocal();
  render();
}
function setWrongMode(){
  mode="wrong";
  wItemList = wrongList;
  currentIdx=0;
  render();
}

function prevItem(){
  if(currentIdx>0){
    currentIdx--;
    saveProgress();
    render();
  }
}
function nextItem(){
  if(currentIdx < wItemList.length-1){
    currentIdx++;
    saveProgress();
    render();
  }
}
function showAnswer(){
  document.getElementById('answerBox').style.display="block";
}
function backToNormal(){
  setNormalMode();
}

// 加入错题本（手动点才加）
function addWrong(){
  const item = wItemList[currentIdx];
  const has = wrongList.some(x=>x.word===item.word && x.pinyin===item.pinyin);
  if(!has){
    wrongList.push(item);
    saveWrong();
    alert("✅ 已加入错题本");
    refreshWrongBtn();
  }
}

// 重新开始：回到第0题，进度重置
function resetAll(){
  if(confirm("确定要重新开始？进度回到第一题")){
    currentIdx=0;
    saveProgress();
    render();
  }
}

// 题库弹窗
function openLib(){
  const dom = document.getElementById("libList");
  dom.innerHTML="";
  wordLib.forEach((it,i)=>{
    dom.innerHTML += `<div class="item"><input type="checkbox" data-idx="${i}"> ${it.pinyin} 【${it.word}】 ${it.explain}</div>`
  })
  document.getElementById("libModal").style.display="flex";
}
function closeLib(){document.getElementById("libModal").style.display="none";}

// 错题本弹窗（支持全选、批量删除、单选删除）
function openWrongBook(){
  const dom = document.getElementById("wrongList");
  dom.innerHTML="";
  wrongList.forEach((it,i)=>{
    dom.innerHTML += `<div class="item check-row">
      <input type="checkbox" class="wrong-check" data-widx="${i}">
      ${it.pinyin} 【${it.word}】 ${it.explain}
      <button class="btn btn-gray" onclick="delOneWrong(${i})">删除</button>
    </div>`
  })
  document.getElementById("wrongModal").style.display="flex";
}
function closeWrongBook(){document.getElementById("wrongModal").style.display="none";}
function selectAllWrong(){
  document.querySelectorAll('.wrong-check').forEach(cb=>cb.checked=true);
}
function delSelectedWrong(){
  const cbs = document.querySelectorAll('.wrong-check:checked');
  const delIdx = Array.from(cbs).map(x=>parseInt(x.dataset.widx)).sort((a,b)=>b-a);
  delIdx.forEach(i=>wrongList.splice(i,1));
  saveWrong();
  openWrongBook();
  refreshWrongBtn();
}
function delOneWrong(i){
  wrongList.splice(i,1);
  saveWrong();
  openWrongBook();
  refreshWrongBtn();
}

window.onload = function(){
  loadLocal();
  setNormalMode();
}
</script>
</body>
</html>
