<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>词语默写本</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{
  background:#f0f7ff;
  background-image:radial-gradient(#dcebfa 1px, transparent 1px);
  background-size:20px 20px;
  padding:16px;color:#222;min-height:100vh;
}
.box{max-width:800px;margin:0 auto}
.top-info{margin-bottom:14px;font-size:18px;color:#333;font-weight:600}
.progress-line{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.mode-tag{font-size:14px;color:#fff;background:#dd4444;border-radius:6px;padding:4px 10px}
.jump-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;font-weight:400}
.jump-row input[type="number"]{width:90px;padding:8px;border:1px solid #b8c8e0;border-radius:8px;font-size:16px}
.btn-row-1{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.btn{padding:10px 16px;border:none;border-radius:99px;font-size:15px;cursor:pointer}
.btn-blue{background:#4080ff;color:#fff}
.btn-gray{background:#c9d8ee;color:#666;cursor:not-allowed}
.btn-light{background:#e6f0ff;color:#3366bb}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 12px #00000010;text-align:center}
.pinyin{font-size:56px;font-weight:bold;margin:12px 0 10px;min-height:60px}
.explain{font-size:22px;color:#444;margin-bottom:24px;min-height:30px}
canvas{border:8px solid #c8d8e8;border-radius:16px;background:#fff;width:100%;touch-action:none;display:block}
.btn-row-2{display:flex;gap:16px;margin-top:24px;justify-content:center;flex-wrap:wrap}
.btn-empty{background:#fff;border:1px solid #b8c8e0;color:#333;display:inline-flex;align-items:center;gap:6px}
.btn-back{background:#4080ff;color:#fff;display:inline-flex;align-items:center;gap:6px}
.answer-area{margin-top:16px;padding:12px;background:#f0f4fa;border-radius:10px;display:none}
.answer-word{font-size:26px;font-weight:bold;color:#222}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal-content{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:700px;max-height:85vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.close{font-size:24px;cursor:pointer}
.item{padding:8px;border-bottom:1px solid #eee;font-size:16px;display:flex;align-items:center;gap:8px}
.tool-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.mini-del{background:#dd4444;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
.empty{color:#999;padding:8px}
.warn{background:#fff3f3;color:#c0392b;border:1px solid #f5b7b1;border-radius:10px;padding:12px;font-size:15px;line-height:1.6;margin-bottom:16px}
</style>
</head>
<body>
<div class="box">
  <div class="top-info">
    <div class="progress-line">
      <span id="progressText">加载中...</span>
      <span class="mode-tag" id="modeTag" style="display:none">错题练习中</span>
    </div>
    <div class="jump-row">
      <span>从第</span>
      <input type="number" id="startIdx" min="1" value="1">
      <span>题开始</span>
      <button class="btn btn-light" onclick="jumpToItem()">跳转</button>
    </div>
  </div>

  <div class="btn-row-1">
    <button class="btn btn-light" onclick="prevItem()">上一题</button>
    <button class="btn btn-light" onclick="nextItem()">下一题</button>
    <button class="btn btn-light" onclick="toggleAnswer()">查看答案</button>
    <button class="btn btn-blue" id="wrongBtn" onclick="addCurrentToWrong()">加入错题本</button>
    <button class="btn btn-light" onclick="openLib()">题库</button>
    <button class="btn btn-light" onclick="openWrongBook()">错题本</button>
    <button class="btn btn-light" onclick="restart()">重新开始</button>
    <button class="btn btn-blue" id="backBtn" style="display:none" onclick="backToBank()">返回题库</button>
  </div>

  <div class="warn" id="warnCard" style="display:none"></div>

  <div class="card">
    <div class="pinyin" id="pinyinBox"></div>
    <div class="explain" id="explainBox"></div>
    <canvas id="drawCanvas"></canvas>
    <div class="btn-row-2">
      <button class="btn btn-empty" onclick="clearCanvas()">☑ 清空画板</button>
      <button class="btn btn-back" onclick="backToBank()">⬅ 返回</button>
    </div>
    <div class="answer-area" id="answerBox">
      <div>正确词语：<span class="answer-word" id="ansWord"></span></div>
    </div>
  </div>
</div>

<!-- 题库弹窗（只读浏览） -->
<div class="modal" id="libModal">
  <div class="modal-content">
    <div class="modal-head"><h3>全部词语题库</h3><span class="close" onclick="closeLib()">×</span></div>
    <div id="libList"></div>
  </div>
</div>

<!-- 错题本弹窗 -->
<div class="modal" id="wrongModal" onclick="if(event.target===this)closeWrongBook()">
  <div class="modal-content">
    <div class="modal-head">
      <h3>错题本（永久保存）</h3>
      <div>
        <button class="btn btn-light" onclick="toggleSelectAll()">全选</button>
        <button class="btn mini-del" onclick="deleteSelectedWrong()">删除所选</button>
      </div>
    </div>
    <div class="tool-row"><button class="btn mini-del" onclick="clearAllWrong()">清空全部</button></div>
    <div id="wrongList"></div>
    <div style="margin-top:12px"><button class="btn btn-blue" onclick="startWrongPractice()">开始做题</button></div>
  </div>
</div>

<script src="wordlib.js?v=3"></script>
<script>
// ====== 读取外部词库（字段：py / word / explain；变量名 wordList）======
const pool = (typeof wordList !== 'undefined') ? wordList : [];

// ====== 本地存储 key（题库进度、错题进度、错题列表、当前模式，全部独立）======
const BANK_IDX_KEY   = 'mori_bank_idx';
const WRONG_IDX_KEY  = 'mori_wrong_idx';
const WRONG_LIST_KEY = 'mori_wrong_list';
const MODE_KEY       = 'mori_mode';

// 兼容旧版错题数据的存储名
const LEGACY_WRONG_KEYS = ['write_wrong_list', 'wrong_list', 'wrongWordList', 'wrongList'];
// 兼容旧版进度存储名
const LEGACY_BANK_KEYS  = ['bankIdx', 'write_progress_idx', 'progress_idx'];
const LEGACY_WRONG_IDX  = ['wrongIdx', 'write_wrong_idx'];

function safeParse(raw){ try { return raw ? JSON.parse(raw) : []; } catch(e){ return []; } }

// 合并新旧所有存储里的错题，并按“拼音+词语”去重
function loadWrong(){
  const seen = new Set();
  const merged = [];
  const sources = [WRONG_LIST_KEY, ...LEGACY_WRONG_KEYS];
  for(const k of sources){
    const list = safeParse(localStorage.getItem(k));
    if(!Array.isArray(list)) continue;
    list.forEach(it=>{
      if(!it || !it.word) return;
      const key = it.word + '||' + (it.py || '');
      if(!seen.has(key)){ seen.add(key); merged.push(it); }
    });
  }
  return merged;
}
function saveWrong(){ localStorage.setItem(WRONG_LIST_KEY, JSON.stringify(wrongList)); }

function readIdx(keys){
  for(const k of keys){
    const v = parseInt(localStorage.getItem(k));
    if(!isNaN(v)) return v;
  }
  return 0;
}

// ====== 状态（两套进度互相隔离）======
let wrongList   = loadWrong();
let mode        = localStorage.getItem(MODE_KEY) || 'bank';
let bankIdx     = parseInt(localStorage.getItem(BANK_IDX_KEY)) || readIdx(LEGACY_BANK_KEYS);
let wrongIdx    = parseInt(localStorage.getItem(WRONG_IDX_KEY)) || readIdx(LEGACY_WRONG_IDX);
let sourceList  = (mode === 'wrong') ? wrongList : pool;
let currentIdx  = (mode === 'wrong') ? wrongIdx : bankIdx;
let answerVisible = false;

// 保存当前模式对应的进度（互不覆盖）
function saveCurrent(){
  if(mode === 'bank'){
    bankIdx = currentIdx;
    localStorage.setItem(BANK_IDX_KEY, bankIdx);
  }else{
    wrongIdx = currentIdx;
    localStorage.setItem(WRONG_IDX_KEY, wrongIdx);
  }
  localStorage.setItem(MODE_KEY, mode);
}

// ====== 画板 ======
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let isDrawing = false, lastX = 0, lastY = 0;
function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = 320;
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#222';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
canvas.addEventListener('pointerdown', e=>{
  isDrawing = true;
  const r = canvas.getBoundingClientRect();
  lastX = e.clientX - r.left; lastY = e.clientY - r.top;
});
canvas.addEventListener('pointermove', e=>{
  if(!isDrawing) return;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
  lastX = x; lastY = y;
});
canvas.addEventListener('pointerup', ()=>isDrawing=false);
canvas.addEventListener('pointercancel', ()=>isDrawing=false);
function clearCanvas(){ ctx.clearRect(0,0,canvas.width,canvas.height); }

// ====== 界面渲染 ======
function updateProgressText(){
  const total = sourceList.length;
  const now = total ? Math.min(currentIdx + 1, total) : 0;
  document.getElementById('progressText').innerText = "总题：" + total + " ｜ 当前：第 " + now + " / " + total + " 题";
  document.getElementById('startIdx').value = total ? now : 1;
}

function refreshWrongBtn(){
  const btn = document.getElementById('wrongBtn');
  if(!sourceList.length || !sourceList[currentIdx]){ btn.style.display='none'; return; }
  btn.style.display = 'inline-block';
  const cur = sourceList[currentIdx];
  const has = wrongList.find(x => x.word === cur.word && x.py === cur.py);
  if(has){
    btn.innerText = '已在错题本';
    btn.className = 'btn btn-gray';
    btn.onclick = null;
  }else{
    btn.innerText = '加入错题本';
    btn.className = 'btn btn-blue';
    btn.onclick = addCurrentToWrong;
  }
}

function render(){
  const warnCard = document.getElementById('warnCard');
  document.getElementById('backBtn').style.display = mode === 'wrong' ? 'inline-block' : 'none';
  document.getElementById('modeTag').style.display = mode === 'wrong' ? 'inline-block' : 'none';
  updateProgressText();
  refreshWrongBtn();

  if(!sourceList || sourceList.length === 0){
    document.getElementById('pinyinBox').innerText = "";
    document.getElementById('explainBox').innerText = "";
    document.getElementById('ansWord').innerText = "";
    document.getElementById('answerBox').style.display = 'none';
    warnCard.style.display = 'block';
    warnCard.innerText = (mode === 'wrong') ? "错题本是空的。点“加入错题本”可把当前题存进来。" : "题库没有加载出来！请检查 wordlib.js 是否存在。";
    return;
  }
  warnCard.style.display = 'none';

  if(currentIdx < 0) currentIdx = 0;
  if(currentIdx >= sourceList.length) currentIdx = sourceList.length - 1;

  const item = sourceList[currentIdx];
  document.getElementById('pinyinBox').innerText = item.py;
  document.getElementById('explainBox').innerText = item.explain;
  document.getElementById('ansWord').innerText = item.word;
  document.getElementById('answerBox').style.display = answerVisible ? 'block' : 'none';
  clearCanvas();
}

// ====== 题目操作 ======
function nextItem(){
  if(!sourceList.length) return;
  currentIdx = (currentIdx + 1) % sourceList.length;
  answerVisible = false; saveCurrent(); render();
}
function prevItem(){
  if(!sourceList.length) return;
  currentIdx = (currentIdx - 1 + sourceList.length) % sourceList.length;
  answerVisible = false; saveCurrent(); render();
}
function toggleAnswer(){
  if(!sourceList.length) return;
  answerVisible = !answerVisible;
  document.getElementById('answerBox').style.display = answerVisible ? 'block' : 'none';
}
function restart(){
  currentIdx = 0; answerVisible = false; saveCurrent(); render();
}

// 题号跳转（题库、错题本各自保留进度）
function jumpToItem(){
  const num = Number(document.getElementById('startIdx').value);
  const max = sourceList.length;
  if(!max){ alert("当前列表为空"); return; }
  if(isNaN(num) || num < 1 || num > max){
    alert("超出范围！请输入 1～" + max);
    return;
  }
  currentIdx = num - 1;
  answerVisible = false;
  saveCurrent();
  render();
}

function addCurrentToWrong(){
  if(!sourceList.length) return;
  const cur = sourceList[currentIdx];
  if(wrongList.find(x => x.word === cur.word && x.py === cur.py)) return;
  wrongList.push(cur);
  saveWrong(); refreshWrongList(); render();
}

// ====== 模式切换（切换前先把当前进度存到对应进度槽）======
function enterBank(){
  if(mode === 'wrong'){
    wrongIdx = currentIdx;
    localStorage.setItem(WRONG_IDX_KEY, wrongIdx);
  }
  mode = 'bank';
  sourceList = pool;
  currentIdx = bankIdx;
  answerVisible = false;
  saveCurrent(); render();
}
function enterWrong(){
  if(mode === 'bank'){
    bankIdx = currentIdx;
    localStorage.setItem(BANK_IDX_KEY, bankIdx);
  }
  mode = 'wrong';
  sourceList = wrongList.slice();
  currentIdx = wrongIdx;
  answerVisible = false;
  saveCurrent(); render();
}
function backToBank(){ enterBank(); }
function startWrongPractice(){
  if(wrongList.length === 0){ alert("错题本是空的"); return; }
  enterWrong(); closeWrongBook();
}

// ====== 题库弹窗 ======
function openLib(){
  const dom = document.getElementById('libList');
  dom.innerHTML = '';
  if(!pool.length){ dom.innerHTML = '<div class="empty">题库为空，词库未加载。</div>'; }
  pool.forEach(it=>{
    const d = document.createElement('div');
    d.className = 'item';
    d.innerText = it.py + " ｜ " + it.word + " ｜ " + it.explain;
    dom.appendChild(d);
  });
  document.getElementById('libModal').style.display = 'flex';
}
function closeLib(){ document.getElementById('libModal').style.display = 'none'; }

// ====== 错题本弹窗（单选 / 全选 / 删除 / 开始做题）======
const selectedWrong = new Set();

function refreshWrongList(){
  const wrap = document.getElementById('wrongList');
  wrap.innerHTML = '';
  if(wrongList.length === 0){ wrap.innerHTML = '<div class="empty">错题本是空的。点“加入错题本”可把当前题存进来。</div>'; return; }
  wrongList.forEach((it, i)=>{
    const key = it.word + '||' + it.py;
    const d = document.createElement('div');
    d.className = 'item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'wrong-check';
    cb.dataset.key = key;
    cb.checked = selectedWrong.has(key);
    cb.onchange = ()=>{ cb.checked ? selectedWrong.add(key) : selectedWrong.delete(key); };
    const txt = document.createElement('span');
    txt.innerText = it.py + " ｜ " + it.word + " ｜ " + it.explain;
    const del = document.createElement('button');
    del.className = 'mini-del'; del.innerText = '删除';
    del.onclick = () => deleteWrongAt(i);
    d.appendChild(cb); d.appendChild(txt); d.appendChild(del);
    wrap.appendChild(d);
  });
}
function toggleSelectAll(){
  const boxes = document.querySelectorAll('.wrong-check');
  const allChecked = Array.from(boxes).every(b => b.checked);
  selectedWrong.clear();
  boxes.forEach(b => {
    b.checked = !allChecked;
    if(b.checked) selectedWrong.add(b.dataset.key);
  });
}
function deleteWrongAt(i){
  const it = wrongList[i];
  selectedWrong.delete(it.word + '||' + it.py);
  wrongList.splice(i, 1);
  saveWrong(); afterWrongChanged(); refreshWrongList();
}
function deleteSelectedWrong(){
  if(selectedWrong.size === 0){ alert("请先勾选要删除的错题"); return; }
  wrongList = wrongList.filter(x => !selectedWrong.has(x.word + '||' + x.py));
  selectedWrong.clear();
  saveWrong(); afterWrongChanged(); refreshWrongList();
}
function clearAllWrong(){
  if(wrongList.length === 0){ alert("错题本已经是空的"); return; }
  if(!confirm("确定清空全部错题吗？")) return;
  wrongList = []; selectedWrong.clear();
  saveWrong(); afterWrongChanged(); refreshWrongList();
}
function afterWrongChanged(){
  if(mode === 'wrong'){
    sourceList = wrongList.slice();
    if(currentIdx >= sourceList.length) currentIdx = sourceList.length - 1;
    if(currentIdx < 0) currentIdx = 0;
    wrongIdx = currentIdx;
    if(sourceList.length === 0){ mode = 'bank'; sourceList = pool; currentIdx = bankIdx; }
  }
  saveCurrent(); render();
}
function openWrongBook(){ refreshWrongList(); document.getElementById('wrongModal').style.display = 'flex'; }
function closeWrongBook(){ document.getElementById('wrongModal').style.display = 'none'; }

// ====== 启动：合并后的错题落盘到新存储 ======
saveWrong();
refreshWrongList();
if(mode === 'wrong' && wrongList.length > 0){ enterWrong(); } else { enterBank(); }
</script>
</body>
</html>
