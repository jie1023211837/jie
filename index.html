<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看拼音写词语（离线版）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{padding:16px;background:#f7f8fa}
.box{max-width:720px;margin:0 auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px #00000012}
.title{font-size:22px;font-weight:bold;margin-bottom:16px;text-align:center}
.pinyin{font-size:34px;margin:12px 0;text-align:center;color:#2563eb;font-weight:bold}
.answer-area{font-size:28px;text-align:center;color:#222;margin:14px 0;min-height:36px}
.hide{visibility:hidden}
canvas{width:100%;height:300px;border:1px solid #ccc;border-radius:10px;background:#fff;touch-action:none}
.row{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{padding:12px 18px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}
button.gray{background:#888}
button.green{background:#10b981}
</style>
</head>
<body>
<div class="box">
  <div class="title">看拼音写词语</div>
  <div class="pinyin" id="showPinyin"></div>
  <div class="answer-area" id="showAnswer" class="hide">答案</div>
  <canvas id="canvas"></canvas>
  <div class="row">
    <button id="clearBtn" class="gray">清空画板</button>
    <button id="showAnsBtn" class="green">显示答案</button>
    <button id="nextBtn">下一题</button>
  </div>
</div>

<script>
const wordList = [
  {py:"chūn tiān",word:"春天"},
  {py:"huā duǒ",word:"花朵"},
  {py:"gāo shān",word:"高山"},
  {py:"bō lán zhuàng kuò",word:"波澜壮阔"},
  {py:"zhǐ gāo qì yáng",word:"趾高气扬"},
  {py:"shān qīng shuǐ xiù",word:"山清水秀"}
];
let idx = 0;
let answerVisible = false;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const showPinyin = document.getElementById("showPinyin");
const showAnswer = document.getElementById("showAnswer");
const clearBtn = document.getElementById("clearBtn");
const showAnsBtn = document.getElementById("showAnsBtn");
const nextBtn = document.getElementById("nextBtn");

let drawing = false;
let lastX = 0, lastY = 0;

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

function drawStart(e){
  drawing=true;
  const p = getPos(e);
  lastX=p.x;lastY=p.y;
}
function drawMove(e){
  if(!drawing) return;
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX,lastY);
  ctx.lineTo(p.x,p.y);
  ctx.lineWidth=4;
  ctx.lineCap="round";
  ctx.strokeStyle="#000000";
  ctx.stroke();
  lastX=p.x;lastY=p.y;
}
function drawEnd(){
  drawing=false;
}
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  if(e.touches){
    return {x:e.touches[0].clientX-rect.left,y:e.touches[0].clientY-rect.top}
  }else{
    return {x:e.clientX-rect.left,y:e.clientY-rect.top}
  }
}
canvas.addEventListener("mousedown",drawStart);
canvas.addEventListener("mousemove",drawMove);
canvas.addEventListener("mouseup",drawEnd);
canvas.addEventListener("mouseleave",drawEnd);
canvas.addEventListener("touchstart",drawStart);
canvas.addEventListener("touchmove",drawMove);
canvas.addEventListener("touchend",drawEnd);

clearBtn.onclick = ()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
};

showAnsBtn.onclick = ()=>{
  answerVisible = !answerVisible;
  if(answerVisible){
    showAnswer.classList.remove("hide");
    showAnsBtn.textContent = "隐藏答案";
  }else{
    showAnswer.classList.add("hide");
    showAnsBtn.textContent = "显示答案";
  }
}

function loadItem(){
  if(idx >= wordList.length) idx = 0;
  const item = wordList[idx];
  showPinyin.textContent = item.py;
  showAnswer.textContent = item.word;
  answerVisible = false;
  showAnswer.classList.add("hide");
  showAnsBtn.textContent = "显示答案";
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
nextBtn.onclick = ()=>{
  idx++;
  loadItem();
}
loadItem();
</script>
</body>
</html>
